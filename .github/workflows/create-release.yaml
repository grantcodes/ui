name: Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish at its current version on main
        required: true
        type: choice
        default: style-dictionary
        options:
          - style-dictionary
          - ui
          - astro

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout code

      - uses: googleapis/release-please-action@v4
        name: Create release PR
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          config-file: release-please-config.json

      - uses: pnpm/action-setup@v4
        name: Setup pnpm
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - uses: actions/setup-node@v6
        name: Setup node
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - run: pnpm install --frozen-lockfile
        name: Install dependencies
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - run: pnpm test
        name: Run tests
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - run: pnpm build
        name: Run build (includes CEM regeneration for @grantcodes/ui)
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      # Regenerate derived artifacts from the just-built CEM, then verify
      # the working tree is clean — any diff aborts the publish.
      - name: Regenerate Astro component typings from CEM
        run: pnpm --filter @grantcodes/astro gen:props
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - name: Verify Astro package contents
        run: pnpm --filter @grantcodes/astro test:package
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - name: Check for dirty working tree (generated artifact drift)
        run: git diff --exit-code
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            steps.release.outputs.releases_created
          }}

      - name: Publish @grantcodes/ui
        if: >-
          ${{
            steps.release.outputs['packages/ui--release_created'] ||
            (github.event_name == 'workflow_dispatch' &&
              inputs.package == 'ui')
          }}
        working-directory: packages/ui
        run: pnpm publish  --provenance --access public

      - name: Publish @grantcodes/style-dictionary
        if: >-
          ${{
            steps.release.outputs[
              'packages/style-dictionary--release_created'
            ] ||
            (github.event_name == 'workflow_dispatch' &&
              inputs.package == 'style-dictionary')
          }}
        working-directory: packages/style-dictionary
        run: pnpm publish  --provenance --access public

      - name: Publish @grantcodes/astro
        if: >-
          ${{
            steps.release.outputs['packages/astro--release_created'] ||
            (github.event_name == 'workflow_dispatch' &&
              inputs.package == 'astro')
          }}
        working-directory: packages/astro
        run: pnpm publish  --provenance --access public
